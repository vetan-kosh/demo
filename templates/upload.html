{% extends "base.html" %}{% block content %}<section class="bg-white rounded-2xl border shadow-sm p-6 md:p-10"><h1 class="text-3xl font-bold">Form 16 Made Simple</h1><p class="mt-2 text-slate-600">Upload your text-based salary-slip PDF to begin. You can review extracted values before continuing.</p><form id="f" class="mt-8"><label class="block font-semibold">Salary Slip PDF</label><input id="pdf" name="file" type="file" accept="application/pdf,.pdf" required class="mt-2 block w-full border rounded-xl p-3"><button id="b" class="mt-5 rounded-xl bg-slate-800 text-white font-semibold px-6 py-3">Upload & Review</button><p id="m" class="mt-3 text-sm"></p></form></section><script>
const f=document.getElementById('f'),m=document.getElementById('m'),b=document.getElementById('b');f.addEventListener('submit',async e=>{e.preventDefault();const file=document.getElementById('pdf').files[0];if(!file)return;if(file.size>15*1024*1024){m.textContent='PDF is too large. Maximum 15 MB.';return;}b.disabled=true;m.textContent='Reading salary slip…';try{const fd=new FormData();fd.append('file',file);const r=await fetch('/api/extract',{method:'POST',body:fd});const j=await r.json();if(!r.ok)throw new Error(j.detail||'Could not read PDF.');const slips=j.data||[];if(!slips.length)throw new Error('No salary data found.');sessionStorage.setItem('extractedSlips',JSON.stringify(slips));const uid=String(j.user_id||'');if(!uid)throw new Error('Secure workflow session could not be created. Please reload and try again.');sessionStorage.setItem('userId',uid);location.href='/review?user_id='+encodeURIComponent(uid);}catch(x){m.textContent=x.message;b.disabled=false;}});
</script>{% endblock %}
