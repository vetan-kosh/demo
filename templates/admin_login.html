<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | VetanKosh</title><style>body{font-family:system-ui;background:#f5f7fb;display:grid;place-items:center;min-height:100vh}.card{background:#fff;padding:28px;border-radius:16px;box-shadow:0 12px 40px #0001;width:min(380px,88vw)}img{width:230px;max-width:100%;display:block;margin:auto}input,button{box-sizing:border-box;width:100%;padding:12px;margin-top:12px;border-radius:10px;border:1px solid #ccd3df}button{background:#12365a;color:white;border:0;font-weight:700}.e{color:#b42318}</style></head><body><form class="card" method="post" action="/admin/login"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><img src="/static/vetankosh-logo.png" alt="VetanKosh"><p>Secure administrator sign in</p>{% if error %}<p class="e">{{ error }}</p>{% endif %}<input name="username" autocomplete="username" required placeholder="Admin ID"><input type="password" name="password" autocomplete="current-password" required placeholder="Password"><button>Continue with Email OTP</button></form></body></html>
