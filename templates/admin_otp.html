<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin OTP | VetanKosh</title><style>body{font-family:system-ui;background:#f5f7fb;display:grid;place-items:center;min-height:100vh}.card{background:white;padding:28px;border-radius:16px;box-shadow:0 12px 40px #0001;width:min(360px,88vw)}input,button{box-sizing:border-box;width:100%;padding:12px;margin-top:12px;border-radius:10px;border:1px solid #ccd3df}button{background:#12365a;color:white;border:0;font-weight:700}.e{color:#b42318}</style></head><body><form class="card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><h1>VetanKosh</h1><p>Enter the 6-digit OTP sent to the admin email.</p>{% if error %}<p class="e">{{ error }}</p>{% endif %}<input name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code"><button>Verify & Sign in</button></form></body></html>
