# Hardened production reverse-proxy template. Obtain TLS certs first (e.g. Certbot),
# then adjust certificate paths and enable this file.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=pdf_upload:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=perip:10m;

server {
    listen 80;
    server_name vetankosh.in www.vetankosh.in;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name vetankosh.in www.vetankosh.in;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/vetankosh.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vetankosh.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    client_max_body_size 15m;
    client_body_timeout 15s;
    keepalive_timeout 30s;
    limit_conn perip 20;

    location = /api/extract {
        limit_req zone=pdf_upload burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
    location / {
        limit_req zone=api_general burst=30 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, do not trust a client-supplied forwarding chain.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
